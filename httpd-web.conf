#
# Applicatin Apache2 settings
#


NameVirtualHost *:80

<VirtualHost *:80>
	ServerName simrh.local
	DocumentRoot "C:/projects/simrh"
	# ServerAlias www.choice.local
	ServerAdmin info@brownpaperbag.co.nz
	ErrorLog "logs/simrh.local-error.log"
	CustomLog "logs/simrh.local-access.log" combined

    RewriteEngine off

	RewriteLog "C:/projects/simrh/rewrite.log"
	RewriteLogLevel 0

	<Directory "C:/projects/simrh">
		DirectoryIndex index.php
		Options FollowSymLinks
		AllowOverride All
		AcceptPathInfo On
		order allow,deny
		allow from all
	</Directory>

    php_flag short_open_tag on
	
